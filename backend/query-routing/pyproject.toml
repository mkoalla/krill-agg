[project]
name = "query-routing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "michaeljwalla", email = "michaeljwalla@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
query-routing = "query_routing.main:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
# pass

[tool.ruff.lint]
ignore = ["EXE002", "F401", "E501"]  # Disables line-too-long and unused-imports globally
select = ["F", "N", "E"]
