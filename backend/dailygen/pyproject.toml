[project]
name = "dailygen"
version = "0.1.0"
description = "Renders the krillion results card (score, distribution curve, percentile) as a PNG"
readme = "README.md"
authors = [
    { name = "michaeljwalla", email = "michael@walla.sh" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
    "resvg-py>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
