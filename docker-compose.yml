services:
  main:
    env_file: .env

    build:
      context: ./backend
      no_cache: true

    volumes:
      - ./data:/app/data/

    networks: [krill-agg]
    depends_on: [dailygen]

    restart: unless-stopped
    image: krill-agg:latest

  # renders the /forcedaily card; only the bot talks to it, over krill-agg.
  # reads avatars from and writes cards to data/dailygen/ on the same mount
  dailygen:
    build:
      context: ./backend/dailygen

    volumes:
      - ./data:/app/data/

    networks: [krill-agg]

    restart: unless-stopped
    image: krill-agg-dailygen:latest

networks:
  krill-agg:
    name: krill-agg
