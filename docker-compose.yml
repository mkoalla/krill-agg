services:
  main:
    env_file: .env

    # host networking: the bot serves no ports, and a bridge network can't get
    # out on hosts whose tailscale exit node swallows forwarded container traffic
    network_mode: host

    build:
      context: ./backend
      network: host
      no_cache: true

    volumes:
      - ./data:/app/data/

    restart: unless-stopped
    image: krill-agg:latest
